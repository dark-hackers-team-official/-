  <style>
    :root{
      --bg:#050806;
      --green:#00ff66;
      --green2:#00c853;
      --text:#c9ffe0;

    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      background: var(--bg);
      color: var(--text);
      overflow-x:hidden;
    }

    /* Matrix */
    #matrix{ position:fixed; inset:0; z-index:-2; background:#000; }
    .veil{
      position:fixed; inset:0; z-index:-1;
      background:
        radial-gradient(1200px 700px at 18% 8%, rgba(0,255,102,.12), transparent 55%),
        radial-gradient(1000px 600px at 85% 20%, rgba(0,255,102,.10), transparent 55%),
        linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,.62));
      pointer-events:none;
    }

    /* Header */
    header{
      padding: 10px 16px 10px;
      border-bottom:1px solid rgba(0,255,102,.18);
      background: rgba(0,0,0,.28);
      backdrop-filter: blur(6px);
      position: sticky; top:0; z-index:10;
    }
    .wrap{max-width: 1050px; margin:0 auto;}
    .topbar{
      display:flex; gap:12px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap;
    }
    h1{
      margin:0;
      font-size: 15px;
      color: var(--green);
      text-shadow: 0 0 12px rgba(0,255,102,.35);
      letter-spacing:.4px;
    }
    .sub{
      margin-top:4px;
      font-size: 11px;
      color: rgba(201,255,224,.88);
      line-height:1.35;
    }

    /* Typing line */
    .terminalLine{
      margin-top:8px;
      font-size: 11px;
      color: rgba(0,255,120,.95);
      border:1px solid rgba(0,255,102,.22);
      background: rgba(0,0,0,.38);
      padding: 6px 10px;
      border-radius: 10px;
      box-shadow: 0 0 18px rgba(0,255,102,.10);
      display:flex;
      align-items:center;
      gap:10px;
      max-width: 900px;
    }
    .prompt{ color: rgba(0,255,102,.92); font-weight:800; }
    .caret{
      width:10px; height:16px;
      background: rgba(0,255,120,.95);
      box-shadow: 0 0 10px rgba(0,255,120,.35);
      animation: blink 0.8s steps(2,end) infinite;
      border-radius:2px;
    }
    @keyframes blink{ 50%{opacity:0} }

    .rightPills{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    .pill{
      font-size:11px;
      color: rgba(201,255,224,.75);
      border:1px solid rgba(0,255,102,.22);
      padding:4px 10px;
      border-radius:999px;
      background: rgba(0,0,0,.35);
      box-shadow: 0 0 18px rgba(0,255,102,.10);
      white-space:nowrap;
    }

    /* Controls */
    .controls{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .input, .select{
      background: rgba(0,0,0,.55);
      border:1px solid rgba(0,255,102,.22);
      color: var(--text);
      padding:10px 12px;
      border-radius: 10px;
      outline:none;
      transition: .15s ease;
      min-width: 200px;
    }
    .input:focus, .select:focus{
      border-color: rgba(0,255,102,.55);
      box-shadow: 0 0 0 3px rgba(0,255,102,.12);
    }
    .btn{
      cursor:pointer;
      user-select:none;
      background: rgba(0,255,102,.12);
      border:1px solid rgba(0,255,102,.35);
      color: var(--green);
      padding:10px 14px;
      border-radius: 10px;
      transition:.15s ease;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn:hover{ background: rgba(0,255,102,.18); }
    .btn.primary{
      background: rgba(0,255,102,.16);
      border-color: rgba(0,255,102,.55);
      box-shadow: 0 0 18px rgba(0,255,102,.12);
    }
    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    /* Main */
    main{ padding: 14px 16px 18px; }
    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 860px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }

    /* Section */
    .section{
      border:1px solid rgba(0,255,102,.18);
      border-radius: 14px;
      overflow:hidden;
      background: rgba(0,0,0,.32);
      box-shadow: 0 0 24px rgba(0,0,0,.35);
    }
    .sectionHead{
      padding: 12px 14px;
      border-bottom:1px solid rgba(0,255,102,.18);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .sectionHead h2{
      margin:0;
      font-size: 13px;
      color: var(--green);
      letter-spacing:.4px;
    }
    .badge{
      font-size: 11px;
      color: rgba(201,255,224,.9);
      border:1px solid rgba(0,255,102,.22);
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(0,0,0,.45);
    }

    /* Cards */
    .cards{
      padding: 12px;
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .card{
      background: var(--card);
      border:1px solid rgba(0,255,102,.18);
      border-left: 6px solid var(--green2);
      border-radius: 12px;
      padding: 12px 12px 11px;
      box-shadow: 0 0 18px rgba(0,255,102,.10);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, opacity .18s ease;
      position:relative;
      overflow:hidden;

      opacity: 0;
      transform: translateY(10px);
    }
    .card.inview{
      opacity: 1;
      transform: translateY(0);
      box-shadow: 0 0 30px rgba(0,255,102,.16);
      border-color: rgba(0,255,102,.30);
    }

    .card:before{
      content:"";
      position:absolute;
      inset:-50% -50%;
      background: linear-gradient(transparent, rgba(0,255,102,.06), transparent);
      transform: rotate(12deg);
      animation: scan 3.6s linear infinite;
      pointer-events:none;
    }
    @keyframes scan{
      0%{ transform: translateY(-30%) rotate(12deg); }
      100%{ transform: translateY(30%) rotate(12deg); }
    }

    .card:hover{
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(0,255,102,.22);
      border-color: rgba(0,255,102,.45);
    }

    .name{
      font-size: 14px;
      font-weight: 800;
      color: #eefff4;
      text-shadow: 0 0 10px rgba(0,255,102,.12);
      margin:0 0 6px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      position:relative;
      z-index:1;
    }
    .name small{
      font-weight: 800;
      color: rgba(0,255,120,.95);
      border:1px solid rgba(0,255,102,.25);

      border-radius:999px;
      background: rgba(0,255,102,.06);
    }
    .meta{
      margin:0;
      font-size: 12px;
      color: rgba(201,255,224,.90);
      line-height: 1.55;
      position:relative;
      z-index:1;
    }
    .meta .k{ color: rgba(0,255,102,.88); }

    /* Public mode hiding */
    .privateOnly{ display:inline; }
    body.public .privateOnly{ display:none; }

    footer{
      padding: 16px 16px 28px;
      border-top:1px solid rgba(0,255,102,.18);
      color: rgba(201,255,224,.75);
      font-size: 12px;
      text-align:center;
      background: rgba(0,0,0,.20);
    }

    /* Toast */
    .toast{
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 9999;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,.70);
      border: 1px solid rgba(0,255,102,.25);
      color: rgba(201,255,224,.92);
      font-size: 12px;
      box-shadow: 0 0 18px rgba(0,255,102,.12);
      transform: translateY(8px);
      opacity:0;
      pointer-events:none;
      transition: .18s ease;
    }
    .toast.show{
      opacity:1;
      transform: translateY(0);
    }

    /* Print styles */
    @media print{

      header{ position: static !important; backdrop-filter:none !important; }

      body{ background:#fff !important; color:#000 !important; }

      .card{ background:#fff !important; box-shadow:none !important; border:1px solid #ddd !important; }
      .card:before{ display:none !important; }
      .name, h1, .sectionHead h2{ color:#000 !important; text-shadow:none !important; }
      .meta .k{ color:#000 !important; }
      footer{ background:#fff !important; color:#000 !important; }
    }
  </style>
</head>

/* ========= Helpers ========= */
function norm(s){ return (s||"").toString().toLowerCase(); }
function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
const toastEl = document.getElementById("toast");
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"), 1800);
}

/* ========= Typing Effect ========= */
const typingText = [
  "connecting to EIIN:120617 ... ok",
  "loading staff records ... ok",
  "public mode enabled (private info hidden)",
  "type to search — filter by role — export PDF / print"
];
let ti = 0, tj = 0, erasing = false;
const typedEl = document.getElementById("typed");
function tick(){
  const line = typingText[ti];
  if(!erasing){
    tj++;
    typedEl.textContent = line.slice(0, tj);
    if(tj >= line.length){
      erasing = true;
      setTimeout(tick, 1200);
      return;
    }
  }else{
    tj--;
    typedEl.textContent = line.slice(0, Math.max(0,tj));
    if(tj <= 0){
      erasing = false;
      ti = (ti + 1) % typingText.length;
      setTimeout(tick, 220);
      return;
    }
  }
  setTimeout(tick, erasing ? 28 : 24);
}
tick();

/* ========= Group/Render ========= */
const sectionOrder = [
  "প্রধান শিক্ষক","সহকারি প্রধান শিক্ষক","সহকারি শিক্ষক",
  "অফিস সহায়ক","অফিস সহকারী কাম কম অপারেটর","কম্পিউটার ল্যাব অপারেটর",
  "নিরাপত্তা কর্মী","নৈশ প্রহরী","আয়া"
];

function groupByRole(list){
  const map = new Map();
  list.forEach(p=>{
    const key = p.role || "অন্যান্য";
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(p);
  });
  return map;
}

function cardHTML(p){
  const subject = p.subject ? ` • <span class="k">বিষয়:</span> ${escapeHtml(p.subject)}` : "";
  const mobile = p.mobile ? ` • <span class="k">মোবাইল:</span> <span class="privateOnly">${escapeHtml(p.mobile)}</span>` : "";
  const dob = p.dob ? ` • <span class="k privateOnly">জন্ম:</span> <span class="privateOnly">${escapeHtml(p.dob)}</span>` : "";
  const nid = p.nid ? ` • <span class="k privateOnly">NID:</span> <span class="privateOnly">${escapeHtml(p.nid)}</span>` : "";
  const tin = p.tin ? ` • <span class="k privateOnly">TIN:</span> <span class="privateOnly">${escapeHtml(p.tin)}</span>` : "";
  return `
    <div class="card">
      <div class="name">${escapeHtml(p.name_bn)} <small>${escapeHtml(p.gender || "")}</small></div>
      <p class="meta">
        <span class="k">EN:</span> ${escapeHtml(p.name_en || "")}<br/>
        <span class="k">পদ:</span> ${escapeHtml(p.role || "")}
        ${subject}${mobile}${dob}${nid}${tin}
      </p>
    </div>
  `;
}

let io = null;
function setupScrollGlow(){
  if(io) io.disconnect();
  const cards = document.querySelectorAll(".card");
  io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add("inview");
      }
    });
  }, { threshold: 0.15 });
  cards.forEach(c=>io.observe(c));
}

function render(list){
  const content = document.getElementById("content");
  content.innerHTML = "";
  const grouped = groupByRole(list);

  const roles = [...grouped.keys()].sort((a,b)=>{
    const ia = sectionOrder.indexOf(a);
    const ib = sectionOrder.indexOf(b);
    if(ia === -1 && ib === -1) return a.localeCompare(b, 'bn');
    if(ia === -1) return 1;
    if(ib === -1) return -1;
    return ia - ib;
  });

  roles.forEach(role=>{
    const people = grouped.get(role) || [];
    const sec = document.createElement("section");
    sec.className="section";
    sec.innerHTML = `
      <div class="sectionHead">
        <h2>▶ ${role}</h2>
        <div class="badge">${people.length} জন</div>
      </div>
      <div class="cards">${people.map(p => cardHTML(p)).join("")}</div>
    `;
    content.appendChild(sec);
  });

  if(list.length === 0){
    content.innerHTML = `<div class="section" style="grid-column:1/-1">
      <div class="sectionHead"><h2>কোনো ফলাফল পাওয়া যায়নি</h2><div class="badge">0</div></div>
      <div class="cards"><div class="card inview"><p class="meta">সার্চ শব্দ বদলে চেষ্টা করুন।</p></div></div>
    </div>`;
  }

  setupScrollGlow();
}

/* ========= Search/Filter ========= */
const q = document.getElementById("q");
const roleSel = document.getElementById("role");
const resetBtn = document.getElementById("reset");

function initRoleOptions(){
  const roles = Array.from(new Set(employees.map(e=>e.role))).sort((a,b)=>a.localeCompare(b,'bn'));
  roles.forEach(r=>{
    const opt = document.createElement("option");
    opt.value = r;
    opt.textContent = r;
    roleSel.appendChild(opt);
  });
}
function apply(){
  const query = norm(q.value).trim();
  const role = roleSel.value;

  const filtered = employees.filter(p=>{
    const matchRole = (role === "all") ? true : p.role === role;
    if(!matchRole) return false;
    if(!query) return true;

    const hay = norm([p.name_bn,p.name_en,p.role,p.subject,p.mobile,p.dob,p.nid,p.tin,p.gender].join(" | "));
    return hay.includes(query);
  });

  render(filtered);
}
q.addEventListener("input", apply);
roleSel.addEventListener("change", apply);
resetBtn.addEventListener("click", ()=>{
  q.value=""; roleSel.value="all"; apply();
});

/* ========= Download PDF Button ========= */
const btnPdf = document.getElementById("btnPdf");
async function downloadPDF(){
  if(typeof html2canvas === "undefined" || typeof window.jspdf === "undefined"){
    toast("PDF library load হয়নি—ইন্টারনেট চেক করুন");
    return;
  }

  btnPdf.disabled = true;
  toast("PDF তৈরি হচ্ছে...");

  // Temporarily hide matrix/veil for clean capture
  const matrix = document.getElementById("matrix");
  const veil = document.querySelector(".veil");
  const oldMatrixDisplay = matrix.style.display;
  const oldVeilDisplay = veil.style.display;
  matrix.style.display = "none";
  veil.style.display = "none";

  // Capture only pdfArea (list content)
  const area = document.getElementById("pdfArea");

  // Increase scale for sharper PDF
  const canvas = await html2canvas(area, {
    backgroundColor: "#ffffff",
    scale: 2,
    useCORS: true
  });

  // restore
  matrix.style.display = oldMatrixDisplay;
  veil.style.display = oldVeilDisplay;

  const imgData = canvas.toDataURL("image/png");
  const { jsPDF } = window.jspdf;

  // A4 size in mm
  const pdf = new jsPDF("p", "mm", "a4");
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();

  // Calculate image size to fit width
  const imgWidth = pageWidth;
  const imgHeight = (canvas.height * imgWidth) / canvas.width;

  // Multi-page support
  let position = 0;
  let heightLeft = imgHeight;

  pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
  heightLeft -= pageHeight;

  while(heightLeft > 0){
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
  }

  const mode = document.body.classList.contains("public") ? "PUBLIC" : "FULL";
  pdf.save(`Staff_Directory_${mode}.pdf`);

  btnPdf.disabled = false;
  toast("PDF ডাউনলোড সম্পন্ন ✅");
}
btnPdf.addEventListener("click", downloadPDF);

/* ========= MATRIX (BRIGHT + DENSE) ========= */
(function matrixRain(){
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const letters = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン";
  const fontSize = 14;
  let columns = Math.floor(canvas.width / fontSize);
  let drops = Array(columns).fill(1);

  function step(){
    ctx.fillStyle = 'rgba(0,0,0,0.04)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = fontSize + "px monospace";
    ctx.fillStyle = 'rgba(0,255,120,0.98)';

    for(let i=0; i<drops.length; i++){
      const text = letters[Math.floor(Math.random()*letters.length)];
      ctx.fillText(text, i*fontSize, drops[i]*fontSize);

      if(drops[i]*fontSize > canvas.height && Math.random() > 0.97){
        drops[i] = 0;
      }
      drops[i]++;
    }
    requestAnimationFrame(step);
  }

  function recalibrate(){
    columns = Math.floor(canvas.width / fontSize);
    drops = Array(columns).fill(1);
  }
  window.addEventListener('resize', recalibrate);

  step();
})();

/* init */
initRoleOptions();
apply();
